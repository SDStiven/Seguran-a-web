services:
  postgres:
    image: postgres:18
    container_name: pg-todolist

    environment:
      POSTGRES_USER: postgresST
      POSTGRES_PASSWORD: postgresST
      POSTGRES_DB: todolistST

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data: